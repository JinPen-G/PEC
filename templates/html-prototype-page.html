    <!-- PROTOTYPE_THEME_BOOTSTRAP_START -->
    <script data-prototype-theme-bootstrap>
      (() => {
        const STORAGE_KEY = 'prototype-theme';
        const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        const readMode = () => {
          try {
            const v = localStorage.getItem(STORAGE_KEY);
            return v === 'light' || v === 'dark' || v === 'auto' ? v : 'auto';
          } catch (error) {
            return 'auto';
          }
        };
        const apply = () => {
          const mode = readMode();
          const resolved = mode === 'auto' && media ? (media.matches ? 'dark' : 'light') : mode;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        };
        if (media) {
          const onSystemChange = () => {
            if (readMode() === 'auto') apply();
          };
          if (media.addEventListener) media.addEventListener('change', onSystemChange);
          else if (media.addListener) media.addListener(onSystemChange);
        }
        window.ElementPrototypeTheme = {
          get mode() {
            return readMode();
          },
          set(mode) {
            if (mode !== 'light' && mode !== 'dark' && mode !== 'auto') return;
            try {
              localStorage.setItem(STORAGE_KEY, mode);
            } catch (error) {
              /* 隱私模式下僅本輪生效 */
            }
            apply();
          },
          apply,
        };
        apply();
      })();
    </script>

      HTML 原型 AI 編寫協議 v2.0（修改頁面前必須完整閱讀）

      目標
      - 本模板用於創建一份完整、可直接在瀏覽器打開的桌面端後臺業務 HTML 頁面。登錄/認證頁獨立創建，僅複用適用的主題變量、字體和控件規範，不復用本模板鎖定的後臺外殼；已有頁面優先在原文件中定向修改。
      - 可將本模板複製爲多個 HTML 文件組成多頁面原型；每個文件都必須能夠單獨打開和運行。
      - 複製本文件創建新頁面，並以本模板作爲唯一的結構與實現基準；不要另建或替換殼層、全局樣式及啓動代碼。
      - 交付物必須是 UTF-8 的完整有效 HTML；不要把解釋、Markdown 代碼圍欄、佔位 TODO 或無關 Prompt 寫入文件。
      - 統一運行依賴通過固定版本 CDN 加載；直接打開頁面時需要能夠訪問這些 CDN 地址。

      執行順序
      1. 先確認頁面用途、信息層級、主要操作、必要狀態和彈窗，再開始改代碼。
      2. 先更新頁面身份和 SHELL_NAV，再依次修改 PAGE_STYLE、PAGE_CONTENT、PAGE_OVERLAYS、PAGE_LOGIC。

      不可破壞的模板契約
      - PROTOTYPE_AI_PROTOCOL_START/END 及其間的協議標題和全部正文必須完整保留；不得只保留版本標題，也不得壓縮、摘要、改寫或刪除協議內容。
      - [TEMPLATE-LOCK] 區域、所有 START/END 標記、#app、prototype-page-manifest 和啓動代碼不得刪除、改名或移動。
      - 只修改 [AI-EDIT] 區域和帶 data-shell-* 的外殼文字；外殼骨架、統一依賴和基礎樣式保持不變。
      - 如需更換頁面主題，只修改 THEME_TOKENS 區域中的強調色與結構色變量，並同步更新全部主色派生變量；不要修改基礎樣式實現。

      - 頁面必須且只能有一個 data-page-content、一個 data-business-content；彈窗和抽屜統一放在 PAGE_OVERLAYS 區域。

      頁面身份必須同步
      - prototype-page-manifest 是本文件內的頁面身份 JSON；按字段用途更新值，不刪除字段或改變 JSON 結構。
      - pageKey、rootClass、data-page-root、data-page-key 與頁面內容根類使用同一 kebab-case 值。
      - 頁面 CSS 以 .{rootClass} 開頭；彈窗/抽屜 CSS 以 .{overlayRootClass} 開頭，不寫無作用域的頁面樣式。
      - client 是頁面所屬端的標識；必須等於 routePath 第一段，routePath 使用 /{client}/{page-path}。
      - <title>、manifest.pageTitle、manifest.menuTitle、正式頁面實際保留的 H1 和 data-shell-page-title 文案保持一致。
      - fileName 使用當前 HTML 文件名並保留 .html 後綴；同一組頁面中的文件名不得重複。

      頁面結構選擇

      - 二級頁面如需顯示對象名稱、編號、業務狀態、表單標題或主要操作，應放在 data-business-content 的業務區塊中；具體信息和佈局由業務需求決定。

      HTML、Vue 與交互規則
      - data-page-header 只約定頁面標題、說明和頁面級操作的位置，不約定其後的業務內容結構。
      - data-business-content 內的現有代碼只是可運行示例，可按業務需求完整替換其結構、組件、信息層級和交互方式；替換時同步更新 PAGE_STYLE、PAGE_OVERLAYS 和 PAGE_LOGIC，並刪除不再使用的示例代碼。
      - 頁面狀態、計算屬性、方法和模擬數據只能寫在 PAGE_LOGIC 中；使用 Vue 3 Composition API，不在 PAGE_LOGIC 中新增 window 全局變量。
      - SHELL_NAV 默認只作爲視覺導航示例，不得添加指向不存在文件的鏈接或虛構跳轉路徑。

      CSS 與視覺規則
      - 頁面專屬樣式只寫在 PAGE_STYLE；優先使用 --app-* 與 --el-* 變量，間距和圓角走 --app-space-* 與 --app-radius-* 刻度，不新增全局樣式、CDN、外部字體或外部圖片。
      - 默認使用淺色中性外殼與 Apple 風格交互藍；項目需要其他主題時，可修改 THEME_TOKENS，但應保持結構背景克制，並讓強調色主要服務於操作、焦點和選中狀態。
      - 內容區的頁面背景、面板、文字、邊框、懸浮層和成功/警告/危險狀態必須引用語義變量；禁止在 PAGE_STYLE 中直接使用白色、黑色或固定灰色替代這些變量。獨立打開時沒有 data-theme 也必須正常顯示淺色頁面。
      - 頁面標題 24px、區塊標題 16px、正文/表格/表單/詳情字段 14px、輔助信息 12-13px；不依賴瀏覽器默認字號。
      - 內容區的佈局、組件和視覺組織由當前業務需求決定；統一使用模板主題變量，並保持信息層級、間距和交互狀態清晰一致。
      - 深淺色適配只依賴語義變量與主題橋接區；頁面不需要、也不應該在 PAGE_STYLE 中書寫 html[data-theme="dark"] 覆蓋或判斷主題的腳本。
      - 桌面端寬度約定：外殼自適應，不給文檔設 min-width，也不產生整頁橫向滾動。1080px 以下側邊欄收成圖標欄、內容區控件降級，1180px 以下兩欄佈局收成單欄；過寬的表格在自身面板內橫向滾動。頁面級主操作在任何寬度下都必須可見可點，不要改成移動端佈局。

      交付自檢
      - 協議塊仍完整存在，見“不可破壞的模板契約”第一條。
      - THEME_TOKENS 只包含完整的強調色、派生色和外殼結構色，沒有把頁面佈局或業務樣式寫入其中。

      - HTML 可直接打開；控制台無錯誤；加載、空數據、校驗、取消、確認和分頁等已用狀態均可操作。
      - 多頁面原型中的相對鏈接均指向實際存在的文件，當前頁面導航項帶 is-active 和 aria-current="page"。
      - Manifest 是有效 JSON，頁面身份字段一致，所有 Vue 模板表達式引用的狀態和方法都在 pageSetup 返回。
      - 沒有修改鎖定區、沒有新增第二份殼層、沒有重複 data-page-* 標記、沒有遺留無用代碼或未使用狀態。

    <script data-prototype-menu-icon-renderer>
      (() => {
        let renderQueued = false;
        const renderMenuIcons = () => {
          if (!window.Vue || !window.ElementPlusIconsVue) return;
          document.querySelectorAll('[data-prototype-menu-icon]').forEach((host) => {
            const iconName = host.getAttribute('data-prototype-menu-icon') || 'Document';
            if (host.dataset.prototypeMenuIconRendered === iconName) return;
            const icon = window.ElementPlusIconsVue[iconName] || window.ElementPlusIconsVue.Document;
            if (!icon) return;
            window.Vue.render(window.Vue.h(icon), host);
            host.dataset.prototypeMenuIconRendered = iconName;
          });
        };
        const scheduleRender = () => {
          if (renderQueued) return;
          renderQueued = true;
          /* 不使用 requestAnimationFrame：隱藏標籤頁和無頭截圖環境下它不會觸發。 */
          setTimeout(() => {
            renderQueued = false;
            renderMenuIcons();
          }, 0);
        };
        /* 導航改爲 v-for、條件渲染或更換圖標名時，Vue 會重建或更新這些節點；觀察導航區補渲染。 */
        const observeShellNav = () => {
          const nav = document.querySelector('[data-prototype-shell="navigation"]');
          if (!nav) return;
          new MutationObserver(scheduleRender).observe(nav, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ['data-prototype-menu-icon'],
          });
        };
        const start = () => {
          renderMenuIcons();
          observeShellNav();
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start, { once: true });
        } else {
          start();
        }
      })();
    </script>

            const matchesKeyword =
              !keyword ||
              item.code.toLowerCase().includes(keyword) ||
              item.name.toLowerCase().includes(keyword);
            return matchesStatus && matchesKeyword;
          });
        });

        const pagedRows = computed(() => {
          const start = (pagination.page - 1) * pagination.pageSize;
          return filteredRows.value.slice(start, start + pagination.pageSize);
        });

        watch(
          () => [filters.keyword, filters.status, pagination.pageSize],
          () => {
            pagination.page = 1;
          },
        );

        const formRules = {
          name: [{ required: true, message: '請輸入資料名稱', trigger: 'blur' }],
          category: [{ required: true, message: '請選擇資料分類', trigger: 'change' }],
        };

        function resetFilters() {
          filters.keyword = '';
          filters.status = '';
          pagination.page = 1;
        }

        function resetForm() {
          form.name = '';
          form.category = '';
          form.enabled = true;
          form.description = '';
        }

        function openCreateDialog() {
          dialogMode.value = 'create';
          editingId.value = null;
          resetForm();
          dialogVisible.value = true;
        }

        function openEditDialog(row) {
          dialogMode.value = 'edit';
          editingId.value = row.id;
          form.name = row.name;
          form.category = row.category;
          form.enabled = row.status === 'enabled';
          form.description = row.description;
          dialogVisible.value = true;
        }

        async function submitForm() {
          if (!formRef.value) return;
          const valid = await formRef.value.validate().catch(() => false);
          if (!valid) return;
          submitting.value = true;
          try {
            await new Promise((resolve) => setTimeout(resolve, 300));
            if (dialogMode.value === 'create') {
              const nextSequence = Math.max(0, ...rows.value.map((item) => item.id)) + 1;
              rows.value.unshift({
                id: nextSequence,
                code: `ITEM-${String(nextSequence).padStart(3, '0')}`,
                name: form.name,
                category: form.category,
                owner: '陳曉',
                status: form.enabled ? 'enabled' : 'disabled',
                description: form.description || '暫無說明',
                source: '手動上傳',
                updatedAt: '2026-07-13 14:30',
              });
            } else {
              const target = rows.value.find((item) => item.id === editingId.value);
              if (target) {
                target.name = form.name;
                target.category = form.category;
                target.status = form.enabled ? 'enabled' : 'disabled';
                target.description = form.description || '暫無說明';
              }
            }
            dialogVisible.value = false;
            ElMessage.success('保存成功');
          } finally {
            submitting.value = false;
          }
        }

        async function removeRow(row) {
          const confirmed = await ElMessageBox.confirm(`確認刪除“${row.name}”嗎？`, '刪除確認', {
            type: 'warning',
          })
            .then(() => true)
            .catch(() => false);
          if (!confirmed) return;
          rows.value = rows.value.filter((item) => item.id !== row.id);
          ElMessage.success('刪除成功');
        }

        function exportRows() {
          ElMessage.success('導出任務已創建');
        }

        function handleDemoBack() {
          ElMessage.info('返回上一頁');
        }

        function showDemoAction(action) {
          ElMessage.info(`${action}：結構示例未連接真實數據`);
        }

        function saveDemoDraft() {
          ElMessage.success('草稿已保存');
        }

        function submitDemoOrder() {
          if (!orderDraft.customer || !orderDraft.pickupStore || !orderDraft.vehicleGroup) {
            ElMessage.warning('請先完成必填信息');
            return;
          }
          ElMessage.success('訂單已建立');
        }

        return {
          Platform: ElementPlusIconsVue.Platform,
          Document: ElementPlusIconsVue.Document,
          Setting: ElementPlusIconsVue.Setting,
          Search: ElementPlusIconsVue.Search,
          Refresh: ElementPlusIconsVue.Refresh,
          Plus: ElementPlusIconsVue.Plus,
          Download: ElementPlusIconsVue.Download,
          ArrowLeft: ElementPlusIconsVue.ArrowLeft,
          demoMode,
          demoModeOptions,
          themeMode,
          themeModeOptions,
          setThemeMode,
          orderDraft,
          rentalRangeSummary,
          filters,
          pagination,
          dialogVisible,
          dialogMode,
          submitting,
          formRef,
          form,
          formRules,
          filteredRows,
          pagedRows,
          resetFilters,
          openCreateDialog,
          openEditDialog,
          submitForm,
          removeRow,
          exportRows,
          handleDemoBack,
          showDemoAction,
          saveDemoDraft,
          submitDemoOrder,
        };
      }
      /* PAGE_LOGIC_END */

      /* TEMPLATE-LOCK: PROTOTYPE_BOOTSTRAP_START。頁面啓動代碼，不得修改或放入業務邏輯。 */
      const app = Vue.createApp({ setup: pageSetup });
      app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
      app.mount('#app');
      /* PROTOTYPE_BOOTSTRAP_END */
    </script>
  </body>
</html>
