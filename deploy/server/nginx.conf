server {
    listen @LISTEN@;
    server_name @HOST@;
    client_max_body_size 128k;
    location / {
        if (-f /opt/preview/state/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:@API_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    error_page 503 @updating;
    location @updating {
        default_type text/html;
        add_header Retry-After 15 always;
        add_header Cache-Control no-store always;
        return 503 '<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>Preview 正在更新</title><body style="font-family:system-ui;padding:12vh 8vw"><h1>正在更新</h1><p>页面将在更新完成后恢复，请稍后刷新。</p></body></html>';
    }
}
